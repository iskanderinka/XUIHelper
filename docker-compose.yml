services:
  tgbot:
    build: .
    container_name: xui-tgbot
    restart: unless-stopped
    environment:
      TZ: Asia/Hong_Kong
    volumes:
      - ./config.yml:/app/config.yml
      - ./data:/app/data
      - ./certs:/app/certs:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro